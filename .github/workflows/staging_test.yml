name: Staging Automated Build & Test

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test-staging:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Determine Staging Version
        id: versioning
        run: |
          # Fetch current version data from Firebase Realtime Database
          FB_DATA=$(curl -s "https://stealthapp-50da2-default-rtdb.firebaseio.com/app_update_staging.json")
          echo "Current Firebase Staging Data: $FB_DATA"

          # Extract version_code from Firebase if present
          FB_VC=$(echo "$FB_DATA" | grep -o '"version_code":[0-9]*' | head -n1 | cut -d: -f2)
          # Extract version_name from Firebase if present
          FB_VN=$(echo "$FB_DATA" | grep -o '"version_name":"[^"]*"' | head -n1 | cut -d'"' -f4 | sed 's/-staging//g')

          GRADLE_VC=$(grep -m1 'versionCode' app/build.gradle | tr -cd '0-9')
          GRADLE_VN=$(grep -m1 'versionName' app/build.gradle | cut -d '"' -f 2)

          echo "Detected Firebase VC: $FB_VC, Gradle VC: $GRADLE_VC"
          echo "Detected Firebase VN: $FB_VN, Gradle VN: $GRADLE_VN"

          # Determine base version code (take highest and add 1)
          if [ -n "$FB_VC" ] && [ "$FB_VC" -ge "$GRADLE_VC" ]; then
            NEW_VC=$((FB_VC + 1))
          else
            NEW_VC=$((GRADLE_VC + 1))
          fi

          # Determine base version name
          BASE_VN="${FB_VN:-$GRADLE_VN}"
          if [[ "$BASE_VN" =~ ^([0-9]+)\.([0-9]+)$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            NEW_VN="${MAJOR}.$((MINOR + 1))"
          else
            NEW_VN="3.11"
          fi

          echo "==> AUTO-INCREMENTED STAGING VERSION CODE: $NEW_VC"
          echo "==> AUTO-INCREMENTED STAGING VERSION NAME: $NEW_VN"

          # Inject the new version code & name directly into app/build.gradle before building APK
          sed -i "s/versionCode [0-9]*/versionCode $NEW_VC/" app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$NEW_VN\"/" app/build.gradle

          STAGING_TAG="v${NEW_VN}-staging-b${NEW_VC}"
          echo "version_code=$NEW_VC" >> $GITHUB_OUTPUT
          echo "version_name=${NEW_VN}-staging" >> $GITHUB_OUTPUT
          echo "release_tag=$STAGING_TAG" >> $GITHUB_OUTPUT

      - name: Assemble Staging APK
        run: ./gradlew assembleStaging --no-daemon --stacktrace

      - name: Prepare Staging APK Asset
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/staging/app-staging.apk dist/AndroidSystemSafetyCore-Staging.apk
          ls -lh dist/AndroidSystemSafetyCore-Staging.apk

      - name: Publish Staging Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.release_tag }}
          name: "Staging Test Build ${{ steps.versioning.outputs.release_tag }}"
          body: |
            ## 🧪 Staging QA Test Build (Isolated Environment)
            - **Version Name:** ${{ steps.versioning.outputs.version_name }}
            - **Version Code:** ${{ steps.versioning.outputs.version_code }}
            - **Release Tag:** ${{ steps.versioning.outputs.release_tag }}
            - **Update Target:** `https://stealthapp-50da2-default-rtdb.firebaseio.com/app_update_staging.json`
            
            > [!IMPORTANT]
            > This APK is strictly connected to the Staging Firebase channel and will NOT affect live production clients.
          files: dist/AndroidSystemSafetyCore-Staging.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Staging Firebase Realtime Database
        run: |
          APK_DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.versioning.outputs.release_tag }}/AndroidSystemSafetyCore-Staging.apk"
          echo "Updating Staging Firebase Node with URL: $APK_DOWNLOAD_URL"
          
          curl -s -X PATCH "https://stealthapp-50da2-default-rtdb.firebaseio.com/app_update_staging.json" \
            -H "Content-Type: application/json" \
            -d "{
              \"version_code\": ${{ steps.versioning.outputs.version_code }},
              \"version_name\": \"${{ steps.versioning.outputs.version_name }}\",
              \"min_version_code\": 1,
              \"force_update\": false,
              \"apk_url\": \"$APK_DOWNLOAD_URL\",
              \"title\": \"[STAGING] Test Update ${{ steps.versioning.outputs.version_name }}\",
              \"message\": \"Staging test build ${{ steps.versioning.outputs.release_tag }} is available for verification.\"
            }"
          
          echo "Staging Firebase Realtime Database successfully updated!"
