plugins {
    id 'com.android.application'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def googleDriveApiKey = localProperties.getProperty('GOOGLE_DRIVE_API_KEY') ?: "AIzaSyAEqQ__xLk00sPeYC2tc4f8dvuP6wJ0JiQ"

android {
    namespace 'com.notrack.stealth'
    compileSdk 34

    defaultConfig {
        applicationId "com.notrack.stealth"
        minSdk 23
        targetSdk 34
        versionCode 17
        versionName "3.13"
        manifestPlaceholders = [appName: "Android System Safety Core"]
        buildConfigField "String", "UPDATE_FEED_URL", '"https://stealthapp-50da2-default-rtdb.firebaseio.com/app_update.json"'
        buildConfigField "String", "ENVIRONMENT_NAME", '"Production"'
        buildConfigField "String", "GOOGLE_DRIVE_API_KEY", "\"${googleDriveApiKey}\""
    }

    buildFeatures {
        buildConfig = true
    }

    signingConfigs {
        permanentSigner {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            v1SigningEnabled true
            v2SigningEnabled true
        }
        release {
            def keystorePath = System.getenv("RELEASE_KEYSTORE_PATH")
            storeFile keystorePath ? file(keystorePath) : file('debug.keystore')
            storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD") ?: 'android'
            keyAlias System.getenv("RELEASE_KEY_ALIAS") ?: 'androiddebugkey'
            keyPassword System.getenv("RELEASE_KEY_PASSWORD") ?: 'android'
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.permanentSigner
            manifestPlaceholders = [appName: "Android System Safety Core"]
            buildConfigField "String", "UPDATE_FEED_URL", '"https://stealthapp-50da2-default-rtdb.firebaseio.com/app_update.json"'
            buildConfigField "String", "ENVIRONMENT_NAME", '"Production"'
        }
        staging {
            initWith debug
            matchingFallbacks = ['debug']
            signingConfig signingConfigs.permanentSigner
            applicationIdSuffix ".staging"
            versionNameSuffix "-staging"
            manifestPlaceholders = [appName: "Safety Core (Staging)"]
            buildConfigField "String", "UPDATE_FEED_URL", '"https://stealthapp-50da2-default-rtdb.firebaseio.com/app_update_staging.json"'
            buildConfigField "String", "ENVIRONMENT_NAME", '"Staging"'
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            manifestPlaceholders = [appName: "Android System Safety Core"]
            buildConfigField "String", "UPDATE_FEED_URL", '"https://stealthapp-50da2-default-rtdb.firebaseio.com/app_update.json"'
            buildConfigField "String", "ENVIRONMENT_NAME", '"Production"'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material

    // Room Database
    implementation libs.room.runtime
    annotationProcessor libs.room.compiler

    // SQLCipher Local DB Encryption
    implementation libs.sqlcipher
    implementation libs.sqlite

    // WorkManager
    implementation libs.work.runtime

    // Biometrics
    implementation libs.biometric

    // Firebase Auth & Realtime Database & Firestore
    implementation libs.firebase.auth
    implementation libs.firebase.database
    implementation libs.firebase.firestore

    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}