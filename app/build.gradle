plugins {
    id 'com.android.application'
}

android {
    namespace 'com.notrack.stealth'
    compileSdk 34

    defaultConfig {
        applicationId "com.notrack.stealth"
        minSdk 23
        targetSdk 34
        versionCode 16
        versionName "3.12"
        manifestPlaceholders = [appName: "Android System Safety Core"]
        buildConfigField "String", "UPDATE_FEED_URL", '"https://stealthapp-50da2-default-rtdb.firebaseio.com/app_update.json"'
        buildConfigField "String", "ENVIRONMENT_NAME", '"Production"'
    }

    buildFeatures {
        buildConfig = true
    }

    signingConfigs {
        permanentSigner {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.permanentSigner
            manifestPlaceholders = [appName: "Android System Safety Core"]
            buildConfigField "String", "UPDATE_FEED_URL", '"https://stealthapp-50da2-default-rtdb.firebaseio.com/app_update.json"'
            buildConfigField "String", "ENVIRONMENT_NAME", '"Production"'
        }
        staging {
            initWith debug
            matchingFallbacks = ['debug']
            signingConfig signingConfigs.permanentSigner
            applicationIdSuffix ".staging"
            versionNameSuffix "-staging"
            manifestPlaceholders = [appName: "Safety Core (Staging)"]
            buildConfigField "String", "UPDATE_FEED_URL", '"https://stealthapp-50da2-default-rtdb.firebaseio.com/app_update_staging.json"'
            buildConfigField "String", "ENVIRONMENT_NAME", '"Staging"'
        }
        release {
            signingConfig signingConfigs.permanentSigner
            minifyEnabled false
            manifestPlaceholders = [appName: "Android System Safety Core"]
            buildConfigField "String", "UPDATE_FEED_URL", '"https://stealthapp-50da2-default-rtdb.firebaseio.com/app_update.json"'
            buildConfigField "String", "ENVIRONMENT_NAME", '"Production"'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material

    // Room Database
    implementation libs.room.runtime
    annotationProcessor libs.room.compiler

    // SQLCipher Local DB Encryption
    implementation libs.sqlcipher
    implementation libs.sqlite

    // WorkManager
    implementation libs.work.runtime

    // Biometrics
    implementation libs.biometric

    // Firebase Auth & Realtime Database & Firestore
    implementation libs.firebase.auth
    implementation libs.firebase.database
    implementation libs.firebase.firestore

    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}